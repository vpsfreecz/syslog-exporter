name: Update dependencies
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without committing or pushing
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: update-dependencies
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'vpsfreecz/syslog-exporter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false
      - name: Update, audit, check and commit lockfile
        id: update
        env:
          DRY_RUN: ${{ inputs.dry_run || github.ref != 'refs/heads/master' || github.event.repository.default_branch != 'master' }}
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          test "$base" = "$GITHUB_SHA"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          git diff --exit-code HEAD
          nix develop --no-write-lock-file -c cargo update
          changes=$(git diff --name-status --no-renames HEAD)
          [[ -z "$changes" || "$changes" == $'M\tCargo.lock' ]]
          test -z "$(git diff --summary HEAD)"
          test -f Cargo.lock && test ! -L Cargo.lock
          test "$(git ls-tree HEAD Cargo.lock | cut -d ' ' -f1)" = 100644
          if [[ -z "$changes" && "$DRY_RUN" != true ]]; then
            echo "No compatible lockfile update."
            exit 0
          fi
          tested_lock=$(sha256sum Cargo.lock)
          database=$(mktemp -d)
          trap 'rm -rf "$database"' EXIT
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "$database"
          echo "base=$base lock=$tested_lock advisory=$(git -C "$database" rev-parse HEAD)"
          nix develop --no-write-lock-file -c cargo audit --no-fetch --db "$database" --file Cargo.lock
          nix config show --json | python3 -c 'import json,sys; c=json.load(sys.stdin); print({k:c[k]["value"] for k in ("sandbox", "sandbox-fallback")}); assert c["sandbox"]["value"] is True and c["sandbox-fallback"]["value"] is False'
          nix build --no-write-lock-file --no-link --print-build-logs --option sandbox true --option sandbox-fallback false .#default
          test "$(sha256sum Cargo.lock)" = "$tested_lock"
          test "$(git diff --name-status --no-renames HEAD)" = "$changes"
          test -z "$(git diff --summary HEAD)"
          if [[ "$DRY_RUN" == true || -z "$changes" ]]; then
            echo "Validation complete; no commit or push."
            exit 0
          fi
          test "$GITHUB_REPOSITORY" = vpsfreecz/syslog-exporter
          test "$GITHUB_REF" = refs/heads/master
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          mkdir -p "$RUNNER_TEMP/ci-hooks"
          {
            printf '#!%s\n' "$(command -v bash)"
            cat <<'HOOK'
          set -euo pipefail
          exec env -u GITHUB_TOKEN nix build --no-write-lock-file --no-link --print-build-logs --option sandbox true --option sandbox-fallback false .#default
          HOOK
          } > "$RUNNER_TEMP/ci-hooks/pre-commit"
          chmod +x "$RUNNER_TEMP/ci-hooks/pre-commit"
          printf '%s\n\n%s\n' 'Update compatible Cargo dependencies' 'Refresh Cargo.lock within the existing manifest constraints.' > "$RUNNER_TEMP/update-message"
          git add -- Cargo.lock
          git -c core.hooksPath="$RUNNER_TEMP/ci-hooks" commit -F "$RUNNER_TEMP/update-message"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push tested lockfile
        if: steps.update.outputs.commit != ''
        env:
          BASE_SHA: ${{ steps.update.outputs.base }}
          COMMIT_SHA: ${{ steps.update.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = vpsfreecz/syslog-exporter
          test "$GITHUB_REF" = refs/heads/master
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          remote=$(git ls-remote origin refs/heads/master | cut -f1)
          test "$remote" = "$BASE_SHA"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          status=0
          git -c core.hooksPath="$RUNNER_TEMP/ci-hooks" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/master || status=$?
          remote=$(git ls-remote origin refs/heads/master | cut -f1)
          echo "push_exit=$status commit=$COMMIT_SHA remote_master=$remote"
          test "$remote" = "$COMMIT_SHA"
